# Local stack (and class-day plan B). No volumes: restarting a database wipes it,
# and the loader refills it within ~20 s.
x-secrets: &secrets
  CLASS_CODE: ${CLASS_CODE:-domi}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-domi-neo4j}

services:
  gateway:
    build: ./gateway
    environment: *secrets
    ports: ["80:8000"]                  # port 80 so campus proxies allow it

  loader:
    build: ./loader
    environment: *secrets
    restart: unless-stopped

  redis:
    image: redis:7.4

  mongo:
    image: mongo:7.0

  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-domi-neo4j}
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]   # Neo4j Browser for the instructor

  influx:
    image: influxdb:3-core
    command: influxdb3 serve --node-id node0 --object-store memory --without-auth

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]                # dashboard: http://localhost:6333/dashboard

  # ---- Visualizers (instructor only; on the VM reach them through the SSH tunnel) ----

  redis-ui:
    image: redis/redisinsight:3.8.0
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: domi
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports: ["5540:5540"]

  mongo-ui:
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports: ["8081:8081"]
    restart: unless-stopped             # exits if Mongo isn't ready yet

  influx-ui:
    image: influxdata/influxdb3-ui:1.0.0
    command: --mode=admin
    environment:
      DEFAULT_INFLUX_SERVER: http://influx:8181
      DEFAULT_INFLUX_DATABASE: domi
      DEFAULT_SERVER_NAME: domi
      DEFAULT_API_TOKEN: unused         # Influx runs without auth, but Explorer wants a value
    ports: ["8888:80"]
